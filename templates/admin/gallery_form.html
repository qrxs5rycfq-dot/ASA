{% extends "admin/base_admin.html" %}

{% block admin_title %}{{ 'Edit Galeri' if item else 'Tambah Galeri' }}{% endblock %}
{% block admin_title_header %}{{ 'Edit Galeri' if item else 'Tambah Galeri' }}{% endblock %}

{% block admin_content %}
<div class="max-w-4xl">
    <div class="mb-6">
        <a href="{{ url_for('admin.gallery') }}" class="text-gray-400 hover:text-white text-sm transition-colors">
            <i class='bx bx-arrow-back mr-1'></i> Kembali ke Daftar Galeri
        </a>
    </div>

    <div class="bg-gray-800 rounded-xl border border-gray-700 p-6">
        <form method="POST" action="{{ url_for('admin.gallery_edit', gid=item.id) if item else url_for('admin.gallery_create') }}" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="title" class="block text-sm font-medium text-gray-300 mb-2">Judul</label>
                    <input type="text" id="title" name="title" value="{{ item.title if item else '' }}" required
                           class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
                <div>
                    <label for="company" class="block text-sm font-medium text-gray-300 mb-2">Perusahaan</label>
                    <input type="text" id="company" name="company" value="{{ item.company if item else '' }}"
                           class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="category" class="block text-sm font-medium text-gray-300 mb-2">Kategori</label>
                    <input type="text" id="category" name="category" value="{{ item.category if item else '' }}"
                           class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
                <div>
                    <label for="icon" class="block text-sm font-medium text-gray-300 mb-2">Icon (Boxicons)</label>
                    <input type="text" id="icon" name="icon" value="{{ item.icon if item else '' }}"
                           class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                           placeholder="bx-image">
                </div>
            </div>

            <div>
                <label for="image_url" class="block text-sm font-medium text-gray-300 mb-2">Image URL</label>
                <input type="url" id="image_url" name="image_url" value="{{ item.image_url if item and item.image_url else '' }}"
                       class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                       placeholder="https://example.com/image.jpg">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="gradient" class="block text-sm font-medium text-gray-300 mb-2">Gradient</label>
                    <input type="text" id="gradient" name="gradient" value="{{ item.gradient if item else '' }}"
                           class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                           placeholder="from-purple-600 to-blue-600">
                </div>
                <div>
                    <label for="sort_order" class="block text-sm font-medium text-gray-300 mb-2">Urutan</label>
                    <input type="number" id="sort_order" name="sort_order" value="{{ item.sort_order if item else 0 }}"
                           class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
            </div>

            <div class="flex items-center space-x-4 pt-4">
                <button type="submit" class="px-6 py-3 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 rounded-lg text-sm font-semibold transition-all">
                    <i class='bx bx-save mr-1'></i> {{ 'Simpan Perubahan' if item else 'Tambah Galeri' }}
                </button>
                <a href="{{ url_for('admin.gallery') }}" class="px-6 py-3 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm font-medium transition-colors">
                    Batal
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
