{% extends "admin/base_admin.html" %}

{% block admin_title %}{{ 'Edit Blog' if post else 'Buat Blog Baru' }}{% endblock %}
{% block admin_title_header %}{{ 'Edit Blog' if post else 'Buat Blog Baru' }}{% endblock %}

{% block admin_content %}
<div class="max-w-4xl">
    <div class="mb-6">
        <a href="{{ url_for('admin.blog_list') }}" class="text-gray-400 hover:text-white text-sm transition-colors">
            <i class='bx bx-arrow-back mr-1'></i> Kembali ke Daftar Blog
        </a>
    </div>

    <div class="bg-gray-800 rounded-xl border border-gray-700 p-6">
        <form method="POST" action="{{ url_for('admin.blog_edit', post_id=post.id) if post else url_for('admin.blog_create') }}" enctype="multipart/form-data" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="title" class="block text-sm font-medium text-gray-300 mb-2">Judul</label>
                    <input type="text" id="title" name="title" value="{{ post.title if post else '' }}" required
                           class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
                <div>
                    <label for="slug" class="block text-sm font-medium text-gray-300 mb-2">Slug</label>
                    <input type="text" id="slug" name="slug" value="{{ post.slug if post else '' }}" required
                           class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
            </div>

            <div>
                <label for="excerpt" class="block text-sm font-medium text-gray-300 mb-2">Excerpt</label>
                <textarea id="excerpt" name="excerpt" rows="3"
                          class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">{{ post.excerpt if post else '' }}</textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Konten</label>
                <div id="editor" style="height: 400px; background: #374151; color: white; border-radius: 0 0 0.5rem 0.5rem;"></div>
                <textarea id="content" name="content" class="hidden">{{ post.content if post else '' }}</textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="category" class="block text-sm font-medium text-gray-300 mb-2">Kategori</label>
                    <input type="text" id="category" name="category" value="{{ post.category if post else '' }}"
                           class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
                <div>
                    <label for="status" class="block text-sm font-medium text-gray-300 mb-2">Status</label>
                    <select id="status" name="status"
                            class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                        <option value="published" {{ 'selected' if post and post.status == 'published' }}>Published</option>
                        <option value="draft" {{ 'selected' if post and post.status == 'draft' }}>Draft</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="cover_icon" class="block text-sm font-medium text-gray-300 mb-2">Cover Icon</label>
                    <input type="text" id="cover_icon" name="cover_icon" value="{{ post.cover_icon if post else 'bx-news' }}"
                           class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
                <div>
                    <label for="cover_gradient" class="block text-sm font-medium text-gray-300 mb-2">Cover Gradient</label>
                    <input type="text" id="cover_gradient" name="cover_gradient" value="{{ post.cover_gradient if post else 'from-purple-600 to-blue-600' }}"
                           class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
            </div>

            <div class="flex items-center space-x-4 pt-4">
                <button type="submit" class="px-6 py-3 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 rounded-lg text-sm font-semibold transition-all">
                    <i class='bx bx-save mr-1'></i> {{ 'Simpan Perubahan' if post else 'Buat Blog' }}
                </button>
                <a href="{{ url_for('admin.blog_list') }}" class="px-6 py-3 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm font-medium transition-colors">
                    Batal
                </a>
            </div>
        </form>
    </div>
</div>
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/monokai-sublime.min.css">
<style>
    .ql-toolbar.ql-snow { background: #1f2937; border-color: #4b5563 !important; border-radius: 0.5rem 0.5rem 0 0; }
    .ql-toolbar .ql-stroke { stroke: #d1d5db !important; }
    .ql-toolbar .ql-fill { fill: #d1d5db !important; }
    .ql-toolbar .ql-picker-label { color: #d1d5db !important; }
    .ql-toolbar .ql-picker-options { background: #374151 !important; border-color: #4b5563 !important; }
    .ql-toolbar .ql-picker-item { color: #d1d5db !important; }
    .ql-toolbar button:hover .ql-stroke, .ql-toolbar button.ql-active .ql-stroke { stroke: #a78bfa !important; }
    .ql-toolbar button:hover .ql-fill, .ql-toolbar button.ql-active .ql-fill { fill: #a78bfa !important; }
    #editor .ql-editor { min-height: 400px; font-size: 15px; line-height: 1.8; color: #e5e7eb; }
    #editor .ql-editor h1 { font-size: 2em; font-weight: 700; margin-bottom: 0.5em; }
    #editor .ql-editor h2 { font-size: 1.5em; font-weight: 700; margin-bottom: 0.5em; }
    #editor .ql-editor h3 { font-size: 1.17em; font-weight: 600; margin-bottom: 0.5em; }
    #editor .ql-editor pre.ql-syntax { background: #1a1a2e; border-radius: 0.5rem; padding: 1em; overflow-x: auto; }
    #editor .ql-editor blockquote { border-left: 4px solid #a78bfa; padding-left: 1em; color: #9ca3af; }
    #editor .ql-editor img { max-width: 100%; border-radius: 0.5rem; margin: 1em 0; cursor: pointer; transition: outline 0.15s; }
    #editor .ql-editor img.img-selected { outline: 3px solid #a78bfa; outline-offset: 2px; }
    /* Image resize UI — rendered outside Quill, fixed to viewport */
    #img-resize-toolbar {
        position: fixed; z-index: 9999; display: none;
        background: #1f2937; border: 1px solid #4b5563; border-radius: 8px;
        padding: 4px 6px; gap: 4px; align-items: center; white-space: nowrap;
        box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    #img-resize-toolbar button {
        background: #374151; color: #d1d5db; border: none; border-radius: 4px;
        padding: 4px 10px; font-size: 12px; cursor: pointer; transition: background 0.15s;
    }
    #img-resize-toolbar button:hover { background: #a78bfa; color: #fff; }
    #img-resize-toolbar button.active { background: #7c3aed; color: #fff; }
    #img-resize-toolbar .separator { border-left: 1px solid #4b5563; height: 20px; margin: 0 4px; }
    #img-resize-info {
        position: fixed; z-index: 9999; display: none;
        background: rgba(0,0,0,0.8); color: #e5e7eb; font-size: 11px; padding: 3px 10px;
        border-radius: 4px; white-space: nowrap; pointer-events: none;
    }
    #img-resize-handle {
        position: fixed; z-index: 9998; display: none;
        width: 12px; height: 12px; background: #a78bfa; border: 2px solid #fff;
        border-radius: 2px; cursor: nwse-resize; box-shadow: 0 0 4px rgba(0,0,0,0.5);
    }
</style>
<!-- Image resize UI elements (outside Quill editor, in document body) -->
<div id="img-resize-toolbar"></div>
<div id="img-resize-info"></div>
<div id="img-resize-handle"></div>

<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
    var quill = new Quill('#editor', {
        theme: 'snow',
        modules: {
            syntax: { hljs: hljs },
            toolbar: {
                container: [
                    [{ 'header': [1, 2, 3, 4, false] }],
                    [{ 'font': [] }],
                    [{ 'size': ['small', false, 'large', 'huge'] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'color': [] }, { 'background': [] }],
                    [{ 'align': [] }],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }, { 'indent': '-1' }, { 'indent': '+1' }],
                    ['blockquote', 'code-block'],
                    ['link', 'image', 'video'],
                    [{ 'direction': 'rtl' }],
                    ['clean']
                ],
                handlers: {
                    image: function() {
                        var editor = this.quill;
                        var input = document.createElement('input');
                        input.setAttribute('type', 'file');
                        input.setAttribute('accept', 'image/*');
                        input.click();
                        input.onchange = async function() {
                            var file = input.files[0];
                            if (file) {
                                var formData = new FormData();
                                formData.append('image', file);
                                try {
                                    var res = await fetch('{{ url_for("admin.upload_image") }}', {
                                        method: 'POST',
                                        body: formData
                                    });
                                    var data = await res.json();
                                    if (data.success) {
                                        var range = editor.getSelection(true);
                                        if (!range) {
                                            range = { index: editor.getLength() - 1, length: 0 };
                                        }
                                        editor.insertEmbed(range.index, 'image', data.url);
                                        editor.setSelection(range.index + 1);
                                    } else {
                                        alert(data.error || 'Upload gagal');
                                    }
                                } catch (e) {
                                    alert('Upload gagal: ' + e.message);
                                }
                            }
                        };
                    }
                }
            }
        }
    });

    // ---- Image Resize Feature (toolbar rendered in document.body) ----
    (function() {
        var selectedImg = null;
        var toolbarEl = document.getElementById('img-resize-toolbar');
        var infoEl = document.getElementById('img-resize-info');
        var handleEl = document.getElementById('img-resize-handle');

        function hideUI() {
            toolbarEl.style.display = 'none';
            infoEl.style.display = 'none';
            handleEl.style.display = 'none';
            if (selectedImg) selectedImg.classList.remove('img-selected');
            selectedImg = null;
        }

        function positionUI() {
            if (!selectedImg) return;
            var r = selectedImg.getBoundingClientRect();
            // Toolbar above image, centered
            toolbarEl.style.display = 'flex';
            toolbarEl.style.position = 'absolute';
            toolbarEl.style.left = Math.max(0, r.left + r.width / 2 - toolbarEl.offsetWidth / 2 + window.scrollX) + 'px';
            toolbarEl.style.top = Math.max(0, r.top - toolbarEl.offsetHeight - 8 + window.scrollY) + 'px';
            // Handle at bottom-right of image
            handleEl.style.display = 'block';
            handleEl.style.position = 'absolute';
            handleEl.style.left = (r.right - 6 + window.scrollX) + 'px';
            handleEl.style.top = (r.bottom - 6 + window.scrollY) + 'px';
            // Info below image
            infoEl.style.display = 'block';
            infoEl.style.position = 'absolute';
            infoEl.textContent = Math.round(r.width) + ' × ' + Math.round(r.height) + ' px';
            infoEl.style.left = (r.left + r.width / 2 - infoEl.offsetWidth / 2 + window.scrollX) + 'px';
            infoEl.style.top = (r.bottom + 6 + window.scrollY) + 'px';
        }

        function selectImage(img) {
            if (selectedImg) selectedImg.classList.remove('img-selected');
            selectedImg = img;
            img.classList.add('img-selected');
            buildToolbarButtons();
            positionUI();
        }

        function buildToolbarButtons() {
            toolbarEl.innerHTML = '';
            var sizes = [
                { label: '25%', w: '25%' },
                { label: '50%', w: '50%' },
                { label: '75%', w: '75%' },
                { label: '100%', w: '100%' },
                { label: 'Auto', w: '' }
            ];
            sizes.forEach(function(s) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = s.label;
                if (selectedImg && selectedImg.style.width === s.w) btn.classList.add('active');
                btn.onmousedown = function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (!selectedImg) return;
                    selectedImg.style.width = s.w;
                    selectedImg.style.height = '';
                    selectedImg.removeAttribute('width');
                    selectedImg.removeAttribute('height');
                    buildToolbarButtons();
                    setTimeout(positionUI, 10);
                };
                toolbarEl.appendChild(btn);
            });
            // Separator
            var sep = document.createElement('span');
            sep.className = 'separator';
            toolbarEl.appendChild(sep);
            // Alignment
            [
                { icon: '◀', title: 'Left',   fn: function(img) { img.style.display = 'block'; img.style.margin = '1em 0'; img.style.float = ''; }},
                { icon: '◆', title: 'Center', fn: function(img) { img.style.display = 'block'; img.style.margin = '1em auto'; img.style.float = ''; }},
                { icon: '▶', title: 'Right',  fn: function(img) { img.style.display = 'block'; img.style.margin = '1em 0 1em auto'; img.style.float = ''; }}
            ].forEach(function(a) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = a.icon;
                btn.title = a.title;
                btn.onmousedown = function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (selectedImg) a.fn(selectedImg);
                    setTimeout(positionUI, 10);
                };
                toolbarEl.appendChild(btn);
            });
        }

        // Drag handle for manual resizing
        handleEl.addEventListener('mousedown', function(e) {
            if (!selectedImg) return;
            e.preventDefault();
            e.stopPropagation();
            var startX = e.clientX;
            var startY = e.clientY;
            var startW = selectedImg.clientWidth;
            var startH = selectedImg.clientHeight;
            var ratio = startH / startW;
            function onMove(ev) {
                var dx = ev.clientX - startX;
                var newW = Math.max(30, startW + dx);
                selectedImg.style.width = newW + 'px';
                selectedImg.style.height = Math.round(newW * ratio) + 'px';
                selectedImg.removeAttribute('width');
                selectedImg.removeAttribute('height');
                positionUI();
            }
            function onUp() {
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
                buildToolbarButtons();
                positionUI();
            }
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        });

        // Click on image in editor
        quill.root.addEventListener('click', function(e) {
            if (e.target && e.target.tagName === 'IMG') {
                e.preventDefault();
                e.stopPropagation();
                selectImage(e.target);
            } else {
                hideUI();
            }
        });

        // Click outside editor hides UI (but not if clicking toolbar itself)
        document.addEventListener('mousedown', function(e) {
            if (selectedImg && !quill.root.contains(e.target) &&
                !toolbarEl.contains(e.target) && e.target !== handleEl) {
                hideUI();
            }
        });

        // Reposition on window scroll / resize
        window.addEventListener('scroll', function() { if (selectedImg) positionUI(); }, true);
        window.addEventListener('resize', function() { if (selectedImg) positionUI(); });
    })();

    // Load existing content
    var existingContent = document.getElementById('content').value;
    if (existingContent) {
        quill.root.innerHTML = existingContent;
    }
    // Sync on submit
    document.querySelector('form').addEventListener('submit', function() {
        document.getElementById('content').value = quill.root.innerHTML;
    });
</script>
{% endblock %}
