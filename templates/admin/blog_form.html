{% extends "admin/base_admin.html" %}

{% block admin_title %}{{ 'Edit Blog' if post else 'Buat Blog Baru' }}{% endblock %}
{% block admin_title_header %}{{ 'Edit Blog' if post else 'Buat Blog Baru' }}{% endblock %}

{% block admin_content %}
<div class="w-full">
    <div class="mb-6">
        <a href="{{ url_for('admin.blog_list') }}" class="text-gray-400 hover:text-white text-sm transition-colors">
            <i class='bx bx-arrow-back mr-1'></i> Kembali ke Daftar Blog
        </a>
    </div>

    <form method="POST" action="{{ url_for('admin.blog_edit', post_id=post.id) if post else url_for('admin.blog_create') }}" enctype="multipart/form-data" id="blogForm">
        <!-- Top bar: title + meta -->
        <div class="bg-gray-800 rounded-xl border border-gray-700 p-6 mb-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
                <div class="lg:col-span-2">
                    <label for="title" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Judul Artikel</label>
                    <input type="text" id="title" name="title" value="{{ post.title if post else '' }}" required
                           placeholder="Masukkan judul artikel..."
                           class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white text-lg placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
                <div>
                    <label for="slug" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Slug URL</label>
                    <input type="text" id="slug" name="slug" value="{{ post.slug if post else '' }}" required
                           placeholder="judul-artikel"
                           class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
            </div>
        </div>

        <!-- Main content editor — full width -->
        <div class="bg-gray-800 rounded-xl border border-gray-700 mb-6 overflow-hidden">
            <div class="px-6 py-3 border-b border-gray-700 flex items-center justify-between">
                <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Konten Artikel</label>
                <div class="flex items-center gap-3">
                    <button type="button" onclick="toggleFullscreen()" class="text-xs text-gray-400 hover:text-purple-400 transition-colors" title="Fullscreen Editor">
                        <i class='bx bx-expand text-base'></i> Fullscreen
                    </button>
                    <span class="text-xs text-gray-500" id="wordCount">0 kata</span>
                </div>
            </div>
            <div id="editor-wrapper">
                <div id="editor"></div>
            </div>
            <textarea id="content" name="content" class="hidden">{{ post.content if post else '' }}</textarea>
        </div>

        <!-- Bottom: excerpt + meta -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
            <div class="lg:col-span-2 bg-gray-800 rounded-xl border border-gray-700 p-6">
                <label for="excerpt" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Ringkasan / Excerpt</label>
                <textarea id="excerpt" name="excerpt" rows="4" placeholder="Ringkasan singkat artikel untuk tampilan di daftar blog..."
                          class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">{{ post.excerpt if post else '' }}</textarea>
            </div>
            <div class="bg-gray-800 rounded-xl border border-gray-700 p-6 space-y-5">
                <div>
                    <label for="category" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Kategori</label>
                    <input type="text" id="category" name="category" value="{{ post.category if post else '' }}" placeholder="Berita, Tutorial, dll."
                           class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
                <div>
                    <label for="status" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Status</label>
                    <select id="status" name="status"
                            class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                        <option value="published" {{ 'selected' if post and post.status == 'published' }}>Published</option>
                        <option value="draft" {{ 'selected' if post and post.status == 'draft' }}>Draft</option>
                    </select>
                </div>
                <div>
                    <label for="cover_icon" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Cover Icon</label>
                    <input type="text" id="cover_icon" name="cover_icon" value="{{ post.cover_icon if post else 'bx-news' }}" placeholder="bx-news"
                           class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
                <div>
                    <label for="cover_gradient" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Cover Gradient</label>
                    <input type="text" id="cover_gradient" name="cover_gradient" value="{{ post.cover_gradient if post else 'from-purple-600 to-blue-600' }}"
                           class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                </div>
            </div>
        </div>

        <!-- Action buttons -->
        <div class="flex items-center space-x-4">
            <button type="submit" class="px-8 py-3 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 rounded-lg text-sm font-semibold transition-all shadow-lg shadow-purple-600/25">
                <i class='bx bx-save mr-1'></i> {{ 'Simpan Perubahan' if post else 'Publikasikan' }}
            </button>
            <a href="{{ url_for('admin.blog_list') }}" class="px-6 py-3 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm font-medium transition-colors">
                Batal
            </a>
        </div>
    </form>
</div>

</style>

<!-- Image resize UI elements (outside Quill editor) -->
<div id="img-resize-toolbar"></div>
<div id="img-resize-info"></div>
<div id="img-resize-handle"></div>
<button type="button" class="fullscreen-exit-btn" onclick="toggleFullscreen()"><i class='bx bx-exit-fullscreen'></i> Keluar Fullscreen</button>

<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
    // ---- Custom Blots ----
    var BlockEmbed = Quill.import('blots/block/embed');
    // Horizontal rule blot
    class DividerBlot extends BlockEmbed {}
    DividerBlot.blotName = 'divider';
    DividerBlot.tagName = 'hr';
    Quill.register(DividerBlot);

    // ---- Quill Editor ----
    var quill = new Quill('#editor', {
        theme: 'snow',
        placeholder: 'Mulai menulis artikel Anda di sini...',
        modules: {
            syntax: { hljs: hljs },
            toolbar: {
                container: [
                    [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
                    [{ 'size': ['small', false, 'large', 'huge'] }],
                    [{ 'font': [] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'script': 'sub' }, { 'script': 'super' }],
                    [{ 'color': [] }, { 'background': [] }],
                    [{ 'align': [] }],
                    [{ 'list': 'ordered' }, { 'list': 'bullet' }, { 'indent': '-1' }, { 'indent': '+1' }],
                    ['blockquote', 'code-block'],
                    ['link', 'image', 'video', 'hr'],
                    [{ 'direction': 'rtl' }],
                    ['clean']
                ],
                handlers: {
                    image: function() {
                        var editor = this.quill;
                        var input = document.createElement('input');
                        input.setAttribute('type', 'file');
                        input.setAttribute('accept', 'image/*');
                        input.click();
                        input.onchange = async function() {
                            var file = input.files[0];
                            if (!file) return;
                            var formData = new FormData();
                            formData.append('image', file);
                            try {
                                var res = await fetch('{{ url_for("admin.upload_image") }}', {
                                    method: 'POST', body: formData
                                });
                                var data = await res.json();
                                if (data.success) {
                                    var range = editor.getSelection(true);
                                    if (!range) range = { index: editor.getLength() - 1, length: 0 };
                                    editor.insertEmbed(range.index, 'image', data.url);
                                    editor.setSelection(range.index + 1);
                                } else {
                                    alert(data.error || 'Upload gagal');
                                }
                            } catch (e) {
                                alert('Upload gagal: ' + e.message);
                            }
                        };
                    },
                    hr: function() {
                        var range = this.quill.getSelection(true);
                        if (!range) range = { index: this.quill.getLength() - 1, length: 0 };
                        this.quill.insertEmbed(range.index, 'divider', true, Quill.sources.USER);
                        this.quill.setSelection(range.index + 1, Quill.sources.SILENT);
                    }
                }
            }
        }
    });

    // ---- Word count ----
    function updateWordCount() {
        var text = quill.getText().trim();
        var count = text ? text.split(/\s+/).length : 0;
        document.getElementById('wordCount').textContent = count + ' kata';
    }
    quill.on('text-change', updateWordCount);
    updateWordCount();

    // ---- Fullscreen toggle ----
    function toggleFullscreen() {
        document.getElementById('editor-wrapper').classList.toggle('fullscreen');
    }
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            document.getElementById('editor-wrapper').classList.remove('fullscreen');
        }
    });

    // ---- Image Resize Feature ----
    (function() {
        var selectedImg = null;
        var toolbarEl = document.getElementById('img-resize-toolbar');
        var infoEl = document.getElementById('img-resize-info');
        var handleEl = document.getElementById('img-resize-handle');

        function hideUI() {
            toolbarEl.style.display = 'none';
            infoEl.style.display = 'none';
            handleEl.style.display = 'none';
            if (selectedImg) selectedImg.classList.remove('img-selected');
            selectedImg = null;
        }

        function positionUI() {
            if (!selectedImg) return;
            var r = selectedImg.getBoundingClientRect();
            toolbarEl.style.display = 'flex';
            toolbarEl.style.position = 'absolute';
            toolbarEl.style.left = Math.max(0, r.left + r.width / 2 - toolbarEl.offsetWidth / 2 + window.scrollX) + 'px';
            toolbarEl.style.top = Math.max(0, r.top - toolbarEl.offsetHeight - 8 + window.scrollY) + 'px';
            handleEl.style.display = 'block';
            handleEl.style.position = 'absolute';
            handleEl.style.left = (r.right - 7 + window.scrollX) + 'px';
            handleEl.style.top = (r.bottom - 7 + window.scrollY) + 'px';
            infoEl.style.display = 'block';
            infoEl.style.position = 'absolute';
            infoEl.textContent = Math.round(r.width) + ' × ' + Math.round(r.height) + ' px';
            infoEl.style.left = (r.left + r.width / 2 - infoEl.offsetWidth / 2 + window.scrollX) + 'px';
            infoEl.style.top = (r.bottom + 8 + window.scrollY) + 'px';
        }

        function selectImage(img) {
            if (selectedImg) selectedImg.classList.remove('img-selected');
            selectedImg = img;
            img.classList.add('img-selected');
            buildToolbarButtons();
            positionUI();
        }

        function buildToolbarButtons() {
            toolbarEl.innerHTML = '';
            [
                { label: '25%', w: '25%' }, { label: '50%', w: '50%' },
                { label: '75%', w: '75%' }, { label: '100%', w: '100%' },
                { label: 'Auto', w: '' }
            ].forEach(function(s) {
                var btn = document.createElement('button');
                btn.type = 'button'; btn.textContent = s.label;
                if (selectedImg && selectedImg.style.width === s.w) btn.classList.add('active');
                btn.onmousedown = function(e) {
                    e.preventDefault(); e.stopPropagation();
                    if (!selectedImg) return;
                    selectedImg.style.width = s.w;
                    selectedImg.style.height = '';
                    selectedImg.removeAttribute('width');
                    selectedImg.removeAttribute('height');
                    buildToolbarButtons();
                    setTimeout(positionUI, 10);
                };
                toolbarEl.appendChild(btn);
            });
            var sep = document.createElement('span'); sep.className = 'separator';
            toolbarEl.appendChild(sep);
            [
                { icon: '◀', title: 'Kiri',   fn: function(img) { img.style.display = 'block'; img.style.margin = '1em 0'; } },
                { icon: '◆', title: 'Tengah', fn: function(img) { img.style.display = 'block'; img.style.margin = '1em auto'; } },
                { icon: '▶', title: 'Kanan',  fn: function(img) { img.style.display = 'block'; img.style.margin = '1em 0 1em auto'; } }
            ].forEach(function(a) {
                var btn = document.createElement('button');
                btn.type = 'button'; btn.textContent = a.icon; btn.title = a.title;
                btn.onmousedown = function(e) {
                    e.preventDefault(); e.stopPropagation();
                    if (selectedImg) a.fn(selectedImg);
                    setTimeout(positionUI, 10);
                };
                toolbarEl.appendChild(btn);
            });
        }

        handleEl.addEventListener('mousedown', function(e) {
            if (!selectedImg) return;
            e.preventDefault(); e.stopPropagation();
            var startX = e.clientX, startW = selectedImg.clientWidth, startH = selectedImg.clientHeight;
            var ratio = startH / startW;
            function onMove(ev) {
                var newW = Math.max(30, startW + (ev.clientX - startX));
                selectedImg.style.width = newW + 'px';
                selectedImg.style.height = Math.round(newW * ratio) + 'px';
                selectedImg.removeAttribute('width'); selectedImg.removeAttribute('height');
                positionUI();
            }
            function onUp() {
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
                buildToolbarButtons(); positionUI();
            }
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        });

        quill.root.addEventListener('click', function(e) {
            if (e.target && e.target.tagName === 'IMG') {
                e.preventDefault(); e.stopPropagation();
                selectImage(e.target);
            } else { hideUI(); }
        });

        document.addEventListener('mousedown', function(e) {
            if (selectedImg && !quill.root.contains(e.target) &&
                !toolbarEl.contains(e.target) && e.target !== handleEl) { hideUI(); }
        });

        window.addEventListener('scroll', function() { if (selectedImg) positionUI(); }, true);
        window.addEventListener('resize', function() { if (selectedImg) positionUI(); });
    })();

    // ---- Load existing content ----
    var existingContent = document.getElementById('content').value;
    if (existingContent) quill.root.innerHTML = existingContent;
    // ---- Sync on submit ----
    document.getElementById('blogForm').addEventListener('submit', function() {
        document.getElementById('content').value = quill.root.innerHTML;
    });
    // ---- Auto-generate slug ----
    document.getElementById('title').addEventListener('input', function() {
        var slugField = document.getElementById('slug');
        if (!slugField.dataset.manual) {
            slugField.value = this.value.toLowerCase().normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-')
                .replace(/^-|-$/g, '');
        }
    });
    document.getElementById('slug').addEventListener('input', function() { this.dataset.manual = '1'; });
</script>
{% endblock %}
