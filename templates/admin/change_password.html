{% extends "admin/base_admin.html" %}

{% block admin_title %}Ubah Password{% endblock %}
{% block admin_title_header %}Ubah Password{% endblock %}

{% block admin_content %}
<div class="max-w-lg">
    <div class="bg-gray-800 rounded-xl border border-gray-700 p-6">
        <form method="POST" action="{{ url_for('admin_change_password') }}" class="space-y-6">
            <div>
                <label for="current_password" class="block text-sm font-medium text-gray-300 mb-2">Password Saat Ini</label>
                <input type="password" id="current_password" name="current_password" required
                       class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
            </div>

            <div>
                <label for="new_password" class="block text-sm font-medium text-gray-300 mb-2">Password Baru</label>
                <input type="password" id="new_password" name="new_password" required
                       class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
            </div>

            <div>
                <label for="confirm_password" class="block text-sm font-medium text-gray-300 mb-2">Konfirmasi Password Baru</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                       class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent">
            </div>

            <div class="pt-4">
                <button type="submit" class="px-6 py-3 bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-700 hover:to-blue-700 rounded-lg text-sm font-semibold transition-all">
                    <i class='bx bx-save mr-1'></i> Ubah Password
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
