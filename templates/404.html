{% extends "base.html" %}
{% block title %}Halaman Tidak Ditemukan{% endblock %}

{% block content %}
<section class="min-h-screen flex items-center justify-center bg-gray-50">
    <div class="absolute inset-0 overflow-hidden">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-purple-100 rounded-full blur-3xl opacity-50 animate-pulse-slow"></div>
        <div class="absolute bottom-1/4 right-1/4 w-72 h-72 bg-red-100 rounded-full blur-3xl opacity-50 animate-pulse-slow" style="animation-delay: 2s;"></div>
    </div>
    <div class="relative text-center px-4">
        <div class="font-display text-9xl font-black gradient-text mb-6">404</div>
        <h1 class="font-display text-3xl font-bold text-gray-900 mb-4">Halaman Tidak Ditemukan</h1>
        <p class="text-gray-500 text-lg mb-8 max-w-md mx-auto">
            Maaf, halaman yang Anda cari tidak tersedia atau telah dipindahkan.
        </p>
        <a href="{{ url_for('public.index') }}" class="inline-flex items-center px-8 py-4 bg-gradient-to-r from-red-600 via-purple-600 to-yellow-500 rounded-2xl font-semibold text-white shadow-2xl hover:scale-105 transition-all duration-300">
            <i class='bx bx-home mr-2'></i>
            Kembali ke Beranda
        </a>
    </div>
</section>
{% endblock %}
